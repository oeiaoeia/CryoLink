{% extends "base.html" %}

{% block title %}404 - Page Not Found | CryoLink{% endblock %}

{% block content %}
<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card glass-card border-0 mb-4 p-5">
                <div class="card-body">
                    <i class="bi bi-search text-warning display-1 mb-4"></i>
                    <h1 class="text-white mb-3">404</h1>
                    <h3 class="text-white-50 mb-4">Page Not Found</h3>
                    <p class="text-muted mb-4">
                        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-outline-light">
                            <i class="bi bi-arrow-left me-2"></i>Go Back
                        </a>
                        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
                            <i class="bi bi-house me-2"></i>Return to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
